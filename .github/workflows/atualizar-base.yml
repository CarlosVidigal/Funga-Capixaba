name: Atualizar Base Funga Capixaba

on:
  schedule:
    - cron: '0 3 * * 0' # Todo domingo às 03:00 UTC
  workflow_dispatch:    # Permite rodar manualmente pelo botão no GitHub

permissions:
  contents: write

# Impede duas coletas simultâneas (e conflitos de push)
concurrency:
  group: atualizar-base
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Coletar iNaturalist, GBIF, SiBBr e speciesLink
        env:
          # Opcional: cadastre sua chave do speciesLink em Settings > Secrets and variables > Actions
          SPLINK_API_KEY: ${{ secrets.SPLINK_API_KEY }}
        run: node scripts/atualizar-dados.mjs

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/status.json muda toda semana (data da última verificação): isso conta como
          # atividade e evita que o GitHub desative o agendamento após 60 dias sem commits.
          git add data/
          if git diff --staged --quiet; then
            echo "Nada a salvar."
          else
            V=$(node -p "require('./data/status.json').version")
            git commit -m "chore(data): atualização semanal da base (v${V})"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
